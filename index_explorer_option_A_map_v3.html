<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나만의 전공 커스텀</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f4ff;
    --white: #ffffff;
    --primary: #3d6ee8;
    --primary-light: #eef2ff;
    --accent: #ff8fab;
    --text: #2b2d42;
    --text-muted: #7b7f9e;
    --border: #dde3f8;
    --radius: 20px;
    --shadow: 0 4px 24px rgba(61,110,232,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px 80px; }
  .wrap { width: 100%; max-width: 600px; }
  .header { text-align: center; margin-bottom: 36px; animation: fadeDown 0.7s ease both; }
  .header img { width: 110px; margin-bottom: 12px; animation: bounceIn 0.8s 0.2s ease both; filter: drop-shadow(0 8px 16px rgba(61,110,232,0.15)); }
  .header h1 { font-family: 'Jua', sans-serif; font-size: clamp(26px, 6vw, 40px); color: var(--primary); line-height: 1.3; margin-bottom: 14px; }
  .header h1 .highlight { color: var(--text); }
  .header p { margin: 0; }
  .progress-wrap { margin-bottom: 24px; }
  .progress-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 700; }
  .progress-bar { height: 8px; background: var(--border); border-radius: 100px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); border-radius: 100px; transition: width 0.4s cubic-bezier(0.34,1.56,0.64,1); }
  .card { background: var(--white); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; box-shadow: var(--shadow); animation: fadeUp 0.5s ease both; transition: box-shadow 0.2s, transform 0.2s; }
  .card:hover { box-shadow: 0 8px 32px rgba(61,110,232,0.14); transform: translateY(-2px); }
  .card-label { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .card-num { width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: 'Jua', sans-serif; font-size: 16px; flex-shrink: 0; }
  .card-num.n1 { background: #fff0f3; color: var(--accent); border: 1.5px solid #ffd6e0; }
  .card-num.n2 { background: #fffbea; color: #e6a800; border: 1.5px solid #ffe566; }
  .card-num.n3 { background: var(--primary-light); color: var(--primary); border: 1.5px solid #c5d4f8; }
  .card-title { font-size: 15px; font-weight: 700; color: var(--text); font-family: 'Jua', sans-serif; }
  .card-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .select-wrap { position: relative; }
  select { width: 100%; background: var(--bg); border: 1.5px solid var(--border); border-radius: 12px; color: var(--text); font-size: 14px; font-family: 'Noto Sans KR', sans-serif; padding: 13px 44px 13px 16px; appearance: none; cursor: pointer; transition: border-color 0.2s; outline: none; }
  select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(61,110,232,0.12); background: var(--white); }
  .select-arrow { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--text-muted); font-size: 11px; }
  .btn { width: 100%; padding: 18px; border: none; border-radius: var(--radius); font-size: 17px; font-weight: 700; font-family: 'Jua', sans-serif; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; background: linear-gradient(135deg, var(--primary) 0%, #6b8ff5 100%); color: #fff; box-shadow: 0 6px 24px rgba(61,110,232,0.28); margin-top: 8px; display: block; text-align: center; text-decoration: none; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(61,110,232,0.35); }
  .btn:active { transform: translateY(0); }
  .btn.link-btn { background: linear-gradient(135deg, #ff8fab, #ffcc00); color: #2b2d42; box-shadow: 0 6px 20px rgba(255,143,171,0.3); margin-top: 10px; font-size: 15px; }
  .btn.link-btn2 { background: linear-gradient(135deg, #3d6ee8, #6b8ff5); margin-top: 10px; font-size: 15px; }
  .warning { color: var(--accent); font-size: 13px; margin-top: 10px; display: none; text-align: center; font-weight: 700; }
  .warning.show { display: block; }
  .info-section { display: none; animation: fadeUp 0.5s ease both; }
  .info-section.show { display: block; }
  .info-header { text-align: center; margin-bottom: 28px; }
  .info-header .emoji { font-size: 48px; display: block; margin-bottom: 12px; }
  .info-header h2 { font-family: 'Jua', sans-serif; font-size: 24px; color: var(--primary); margin-bottom: 8px; }
  .info-header p { color: var(--text-muted); font-size: 14px; line-height: 1.7; }
  .input-group { margin-bottom: 14px; }
  .input-label { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 6px; display: block; }
  input[type=text] { width: 100%; background: var(--bg); border: 1.5px solid var(--border); border-radius: 12px; color: var(--text); font-size: 14px; font-family: 'Noto Sans KR', sans-serif; padding: 13px 16px; outline: none; transition: border-color 0.2s; }
  input[type=text]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(61,110,232,0.12); background: var(--white); }
  .result { display: none; }
  .result.show { display: block; animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both; }
  .result-card { background: var(--white); border-radius: var(--radius); overflow: hidden; border: 1.5px solid var(--border); box-shadow: 0 8px 40px rgba(61,110,232,0.12); }
  .result-header { padding: 36px 28px 28px; text-align: center; }
  .result-header.matched { background: linear-gradient(160deg, #eef2ff 0%, #f8f0ff 100%); border-bottom: 1.5px solid var(--border); }
  .result-header.new-one { background: linear-gradient(160deg, #fff5f7 0%, #fffbea 100%); border-bottom: 1.5px solid var(--border); }
  .result-emoji { font-size: 64px; display: block; margin-bottom: 16px; animation: bounceIn 0.6s 0.2s ease both; }
  .result-tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; padding: 4px 14px; border-radius: 100px; margin-bottom: 14px; font-family: 'Jua', sans-serif; }
  .result-tag.matched { background: var(--primary-light); color: var(--primary); border: 1px solid #c5d4f8; }
  .result-tag.new-one { background: #fff0f3; color: var(--accent); border: 1px solid #ffd6e0; }
  .result-name { font-family: 'Jua', sans-serif; font-size: clamp(20px, 5vw, 28px); line-height: 1.3; }
  .result-name.matched { color: var(--primary); }
  .result-name.new-one { color: var(--accent); }
  .result-body { padding: 24px 28px 28px; }
  .result-desc { font-size: 15px; line-height: 1.9; color: var(--text-muted); margin-bottom: 20px; }
  .selected-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .selected-tag { background: var(--primary-light); border: 1px solid #c5d4f8; border-radius: 100px; padding: 6px 14px; font-size: 12px; color: var(--primary); font-weight: 700; }
  .retry-btn { width: 100%; padding: 15px; border-radius: 14px; background: var(--white); border: 1.5px solid var(--border); color: var(--text-muted); font-size: 14px; font-family: 'Jua', sans-serif; cursor: pointer; transition: all 0.2s; margin-top: 12px; }
  .retry-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
  .submit-status { text-align: center; font-size: 13px; color: var(--primary); margin-top: 10px; min-height: 20px; font-weight: 700; }

  .loading-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(240,244,255,0.95);
    z-index: 999;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.3s ease;
  }
  .loading-overlay.show { display: flex; }
  .loading-spinner {
    width: 64px; height: 64px;
    border: 5px solid #dde3f8;
    border-top-color: #3d6ee8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
  }
  .loading-text {
    font-family: 'Jua', sans-serif;
    font-size: 20px;
    color: var(--primary);
    margin-bottom: 8px;
  }
  .loading-sub {
    font-size: 13px;
    color: var(--text-muted);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes popIn { from { opacity: 0; transform: scale(0.93); } to { opacity: 1; transform: scale(1); } }
  @keyframes bounceIn { 0% { transform: scale(0) rotate(-10deg); } 60% { transform: scale(1.15) rotate(5deg); } 100% { transform: scale(1) rotate(0deg); } }

/* ===== EXPLORER DESIGN A: rich map parchment ===== */
:root{--bg:#ead4ad;--white:#fff8e9;--primary:#243b53;--primary-light:#efe1c7;--accent:#b88958;--text:#24384b;--text-muted:#78664f;--border:#d7b98b;--radius:22px;--shadow:0 10px 28px rgba(83,57,28,.14)}
html{background:#ead4ad}
body.explorer-theme{background-color:#ead4ad;background-image:radial-gradient(ellipse at 12% 8%,rgba(255,247,224,.88) 0 16%,transparent 38%),radial-gradient(ellipse at 90% 35%,rgba(206,170,113,.38) 0 12%,transparent 36%),radial-gradient(ellipse at 50% 92%,rgba(255,246,222,.8) 0 18%,transparent 48%),repeating-linear-gradient(125deg,rgba(126,91,47,.035) 0 1px,transparent 1px 10px);padding:28px 22px 70px;font-family:'Noto Sans KR',sans-serif}
body.explorer-theme:before{content:'✦　♧　　⌖　　　　　　　　　♧　✦';position:fixed;inset:0 0 auto;height:100vh;pointer-events:none;z-index:0;color:rgba(112,86,50,.24);font-size:clamp(22px,4vw,48px);line-height:2.4;letter-spacing:18px;overflow:hidden;word-break:break-all}
.wrap{position:relative;z-index:1;width:100%;max-width:1120px}
.header{position:relative;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 20px 24px;margin-bottom:18px;border-radius:30px;background:linear-gradient(115deg,rgba(255,246,224,.72),rgba(255,250,238,.88));border:1px solid rgba(181,143,87,.55);box-shadow:0 8px 24px rgba(91,63,31,.08);overflow:hidden}
.header:after{content:'✧　⌖　　➤';position:absolute;right:24px;top:18px;color:#a68150;font-size:25px;opacity:.75}
.header .explorer-mascot{width:clamp(130px,20vw,205px);height:auto;max-height:235px;object-fit:contain;margin:0 0 4px;filter:drop-shadow(0 7px 4px rgba(82,57,30,.13));animation:bounceIn .8s .2s ease both}
.header h1{font-size:clamp(30px,4.5vw,48px);line-height:1.2;color:#243b53;margin:2px 0 12px;letter-spacing:-.7px;text-shadow:0 1px 0 #fff8e8}
.header h1 .highlight{color:#875c35}
.header > div[style*='linear-gradient']{background:transparent!important;padding:0!important;margin-top:0!important}
.header > div[style*='linear-gradient'] p{color:#4c4a40!important;font-family:'Noto Sans KR',sans-serif!important;font-size:clamp(14px,1.6vw,17px)!important;line-height:1.8!important}
.header p{font-size:clamp(14px,1.6vw,17px);line-height:1.8;color:#4c4a40}
.progress-wrap{margin:0 auto 22px;max-width:760px;padding:15px 24px;background:#f8ecd5;border:1px solid #d8b98b;border-radius:999px;box-shadow:0 5px 14px rgba(91,63,31,.1)}
.progress-label{color:#78664f}.progress-bar{height:10px;background:#e3cfaa}.progress-fill{background:linear-gradient(90deg,#263f58,#b88a56)}
.card{background:rgba(255,249,235,.95);border:1.5px solid #d7b98b;border-radius:22px;padding:clamp(20px,3vw,32px);box-shadow:0 7px 20px rgba(88,60,28,.11);backdrop-filter:blur(2px)}
.card:hover{box-shadow:0 12px 26px rgba(88,60,28,.16);transform:translateY(-2px)}
.card-num{border-radius:50%!important;background:#a77b4d!important;color:#fff8e9!important;border:2px solid #ead4ad!important;width:42px;height:42px;font-size:18px}
.card-num.n2{background:#7d8968!important}.card-num.n3{background:#263f58!important}
.card-title{font-size:clamp(16px,1.7vw,20px);color:#263f58}.card-sub{font-size:13px;color:#78664f}
select{background:#fffaf0;border-color:#d9c6a7;border-radius:999px;padding:14px 44px 14px 18px;font-size:15px;color:#394657}
select:focus{border-color:#a77b4d;box-shadow:0 0 0 3px rgba(167,123,77,.15)}
.btn{background:linear-gradient(135deg,#263f58,#1b3045)!important;border-radius:999px!important;color:#fff8e9!important;font-size:16px!important;box-shadow:0 5px 0 #c6a77c,0 8px 16px rgba(48,43,32,.14)!important;letter-spacing:.1px}
.btn:hover{filter:brightness(1.08)}
input,textarea{background:#fffaf0!important;border-color:#d9c6a7!important;border-radius:14px!important;color:#263f58!important}
.loading-overlay{background:rgba(239,221,187,.94)!important;color:#263f58!important}
@media(min-width:760px){body.explorer-theme{padding-top:24px}.header{display:grid;grid-template-columns:minmax(170px,260px) 1fr;column-gap:24px;text-align:left;min-height:235px;padding:18px 36px}.header .explorer-mascot{grid-column:1;grid-row:1 / span 2;width:100%;max-height:220px;justify-self:center;margin:0}.header h1,.header p{grid-column:2;text-align:left}.header h1{align-self:end}.header p{align-self:start}}
@media(max-width:600px){body.explorer-theme{padding:14px 12px 40px}.header{min-height:0;padding:20px 14px;border-radius:22px}.header .explorer-mascot{width:132px}.header:after{font-size:18px;right:12px}.progress-wrap{padding:12px 14px}.card{padding:20px 16px}}

/* Header subtitle refinement: integrate the original tagline into the explorer heading */
.header{gap:0;background:linear-gradient(135deg,rgba(250,239,214,.96),rgba(255,249,235,.96));border:1px solid #d1b181;box-shadow:inset 0 0 0 5px rgba(216,188,143,.18),0 9px 24px rgba(91,63,31,.10)}
.header h1{position:relative;display:inline-block;width:fit-content;max-width:100%;margin:0 0 12px;padding-bottom:12px;font-size:clamp(31px,4.6vw,49px);letter-spacing:-.8px}
.header h1:after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);height:2px;border-radius:4px;background:linear-gradient(90deg,#a77b4d 0%,#d6b98b 55%,rgba(214,185,139,.12) 100%)}
.header-tagline{display:flex;align-items:center;justify-content:center;gap:12px;width:fit-content;max-width:100%;margin:0 auto;padding:10px 20px;border-top:0;border-bottom:0;color:#59472f;position:relative}
.header-tagline p{margin:0;font-family:'Noto Sans KR',sans-serif;font-size:clamp(14px,1.55vw,17px);font-weight:600;line-height:1.85;letter-spacing:-.25px;color:#59472f;text-align:center}
.header-tagline .tagline-mark{font-family:serif;font-size:15px;color:#a77b4d;flex:0 0 auto}
@media(min-width:760px){.header{grid-template-columns:minmax(170px,260px) minmax(0,1fr);grid-template-rows:auto auto;align-items:center;column-gap:30px;padding:22px 38px}.header .explorer-mascot{grid-column:1;grid-row:1 / span 2;width:100%;max-height:225px}.header h1{grid-column:2;grid-row:1;align-self:end;text-align:left;margin:0 0 10px}.header h1:after{left:0;transform:none}.header-tagline{grid-column:2;grid-row:2;justify-self:start;margin:0;justify-content:flex-start;padding:9px 0;border-top:0;border-bottom:0}.header-tagline p{text-align:left}.header-tagline .tagline-mark:first-child{display:none}}
@media(max-width:759px){.header{display:flex;text-align:center}.header h1{margin-bottom:12px;width:100%}.header h1:after{left:50%;transform:translateX(-50%);width:min(88%,520px)}.header-tagline{margin-top:0}}

</style>
</head>

let selectedMajors=[], calculatedResult=null;

['sel1','sel2','sel3'].forEach(id=>{
  const sel=document.getElementById(id);
  departments.forEach(d=>{const opt=document.createElement('option');opt.value=d;opt.textContent=d;sel.appendChild(opt);});
});

function updateProgress(){
  const filled=['sel1','sel2','sel3'].filter(id=>document.getElementById(id).value!=='').length;
  document.getElementById('progressFill').style.width=(filled/3*100)+'%';
}

function goToInfo(){
  const v1=document.getElementById('sel1').value, v2=document.getElementById('sel2').value, v3=document.getElementById('sel3').value;
  const warn=document.getElementById('warning');
  if(!v1||!v2||!v3){warn.textContent='⚠️ 전공 3개를 모두 선택해주세요!';warn.classList.add('show');return;}
  if(v1===v2||v2===v3||v1===v3){warn.textContent='⚠️ 서로 다른 전공 3개를 선택해주세요!';warn.classList.add('show');return;}
  warn.classList.remove('show');
  selectedMajors=[v1,v2,v3];
  calculatedResult=calcResult(selectedMajors);
  document.getElementById('formSection').style.display='none';
  document.getElementById('infoSection').classList.add('show');
  window.scrollTo({top:0,behavior:'smooth'});
}

function backToForm(){
  document.getElementById('formSection').style.display='block';
  document.getElementById('infoSection').classList.remove('show');
  document.getElementById('inputName').value='';
  document.getElementById('inputStudentId').value='';
  document.getElementById('inputDept').value='';
  document.getElementById('infoWarning').classList.remove('show');
  window.scrollTo({top:0,behavior:'smooth'});
}

function calcResult(selected){
  let candidates=[];
  majors.forEach(m=>{
    const overlap=selected.filter(s=>m.depts.includes(s)).length;
    if(overlap>=3) candidates.push({major:m, ratio:overlap/m.depts.length});
  });
  if(!candidates.length) return null;
  candidates.sort((a,b)=>b.ratio-a.ratio);
  const topRatio=candidates[0].ratio;
  const top=candidates.filter(c=>c.ratio===topRatio);
  return top[Math.floor(Math.random()*top.length)].major;
}

function submitAndShowResult(){
  const btn=document.getElementById('submitBtn');
  if(btn.disabled) return;
  const name=document.getElementById('inputName').value.trim();
  const studentId=document.getElementById('inputStudentId').value.trim();
  const dept=document.getElementById('inputDept').value.trim();
  const warn=document.getElementById('infoWarning');
  btn.disabled=true;
  warn.classList.remove('show');
  document.getElementById('infoSection').classList.remove('show');
  document.getElementById('loadingOverlay').classList.add('show');
  setTimeout(()=>{
    document.getElementById('loadingOverlay').classList.remove('show');
    showResult(calculatedResult, selectedMajors);
  }, 1500);
  fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({name,studentId,department:dept,major1:selectedMajors[0],major2:selectedMajors[1],major3:selectedMajors[2],result:calculatedResult?calculatedResult.name:'매칭없음'})})
}

function showResult(major,selected){
  const card=document.getElementById('resultCard');
  const links=`<a href="${HOME_URL}" target="_blank" style="display:block;text-decoration:none"><button class="btn" style="background:linear-gradient(135deg,#ffe8a3,#ffd166);color:#2b2d42;box-shadow:0 4px 16px rgba(255,209,102,0.4);margin-top:10px;font-size:15px;">🏫 커리큘럼 구경하러 가기</button></a><a href="${NOTICE_URL}" target="_blank" style="display:block;text-decoration:none"><button class="btn" style="background:linear-gradient(135deg,#ffd6e0,#ffb3c6);color:#2b2d42;box-shadow:0 4px 16px rgba(255,214,224,0.4);margin-top:10px;font-size:15px;">📋 학생설계전공 신청안내</button></a>`;
  const tags=selected.map(s=>`<span class="selected-tag">📚 ${s}</span>`).join('');
  if(major){
    card.innerHTML=`<div class="result-header matched"><span class="result-emoji">${major.emoji}</span><div class="result-tag matched">✦ 매칭된 설계전공</div><div class="result-name matched">${major.name}</div></div><div class="result-body"><p class="result-desc">${major.desc}</p><div class="selected-tags">${tags}</div>${links}</div>`;
  } else {
    card.innerHTML=`<div class="result-header new-one"><span class="result-emoji">🚀</span><div class="result-tag new-one">✦ 새로운 조합 발견!</div><div class="result-name new-one">아직 없는 전공이에요!</div></div><div class="result-body"><p class="result-desc">이 조합으로 승인된 설계전공은 아직 없어요! 어쩌면 당신이 최초일지도? 🌟 지금까지 없던 나만의 전공 직접 만들어보는 건 어떨까요? 학생설계전공 신청으로 새 역사를 써봐요!</p><div class="selected-tags">${tags}</div>${links}</div>`;
  }
  document.getElementById('resultSection').classList.add('show');
  window.scrollTo({top:0,behavior:'smooth'});
}

function retry(){
  document.getElementById('formSection').style.display='block';
  document.getElementById('resultSection').classList.remove('show');
  document.getElementById('infoSection').classList.remove('show');
  ['sel1','sel2','sel3'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('progressFill').style.width='0%';
  document.getElementById('submitStatus').textContent='';
  const submitBtn=document.getElementById('submitBtn');
  if(submitBtn){submitBtn.disabled=false;submitBtn.textContent='결과 확인하기 🎓';}
  document.getElementById('loadingOverlay').classList.remove('show');
  document.getElementById('inputName').value='';
  document.getElementById('inputStudentId').value='';
  document.getElementById('inputDept').value='';
  window.scrollTo({top:0,behavior:'smooth'});
}
